services:
  ai-training-cnn:
    image: ai-training-cnn:v20260903
    build:
      context: .
      dockerfile: Dockerfile_main
    container_name: ai-training-cnn
    restart: unless-stopped
    # Run cron in foreground (already set in Dockerfile CMD, but explicit here)
    command: [ "cron", "-f" ]
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
      - ./data:/app/data
    env_file:
      - run.env
    # Optional: sync container time with host
    environment:
      - TZ=Asia/Singapore
      - DRY_RUN=true   # 安全默认：嘴炮模式。真跑改 false 后 `docker compose up -d`
