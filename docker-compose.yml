services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./auth:/etc/nginx/auth:ro
      - ./www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./attribution_v2/dashboard:/usr/share/nginx/dashboard:ro
      - ./attribution_v2/reports:/usr/share/nginx/reports:ro
