services:
  fx-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fx-trade-bot
    restart: unless-stopped
    # Run cron in foreground (already set in Dockerfile CMD, but explicit here)
    command: [ "cron", "-f" ]
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
      - ./data:/app/data
    env_file:
      - .env
    # Optional: sync container time with host
    environment:
      - TZ=UTC
      - DRY_RUN=true   # 安全默认：嘴炮模式。真跑改 false 后 `docker compose up -d`