# Weekly Outlier Down-Weighting (W 侧样本生成专用；D/M 不受影响)
# 仅对 weekly_lookback 窗口内的异常周降权，保留完整时间序列(只降权、不删除)
weekly_outlier_detect: True    # 开关：False = 旧行为(权重恒 1.0)
weekly_z_threshold: 2.5        # Z-score 阈值：|Z| 超过即标记为异常周
weekly_outlier_weight: 0.3     # 异常周权重：原值 × 此系数
weekly_extreme_weight: 0.5     # 连续极端周权重

# Simulation Parameters
simulations: 5000
confidence: 0.90
student_t_df: 5

# Timeframe Lookback & Forecast
daily_lookback: 90
daily_forecast: 5
weekly_lookback: 260
weekly_forecast: 4 #52
monthly_lookback: 120 
monthly_forecast: 12 #24

# Pairs List (Clean Symbols — Unique, Alphabetically Sorted)
pairs:
  - AUDCHF
  - AUDJPY
  - AUDNZD
  - AUDUSD
  - AUDCAD
